[package]
name = "wash"
categories = ["wasm", "command-line-utilities"]
description = "The Wasm Shell (wash) for developing and publishing Wasm components"
keywords = ["webassembly", "wasm", "component", "wash", "cli"]
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/wasmcloud/wasmCloud"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["wasi-webgpu", "wasm_component_model_implements"]
wasi-tls = ["wash-runtime/wasi-tls"]
# Route component-model `(implements ..)` named imports to per-import backends.
# On by default: `wash host`/`wash dev` register the multiplexed keyvalue plugin
# (the unnamed/default import keeps its standalone backend, so normal workloads
# are unaffected). Disable with `--no-default-features` for a build that rejects
# components importing an interface more than once.
wasm_component_model_implements = ["wash-runtime/wasm_component_model_implements"]
# Host component plugins: host capabilities provided by wasm components running
# in their own supervised stores (wash-runtime's `plugin::component_host`).
host-component-plugins = ["wash-runtime/host-component-plugins"]
# On by default. Pulls in git-only wasi-gfx deps (no crates.io release);
# disable with `--no-default-features` for a build without the git sources.
wasi-webgpu = ["wash-runtime/wasi-webgpu"]

[lints]
workspace = true

[lib]
name = "wash"
path = "src/lib.rs"

[[bin]]
name = "wash"
path = "src/main.rs"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
anyhow = { workspace = true }
async-nats = { workspace = true }
bon = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env", "help", "color", "suggestions", "wrap_help", "cargo", "string"] }
clap_complete = { workspace = true }
clap-markdown = { workspace = true }
ctrlc = { workspace = true }
dialoguer = { workspace = true, features = ["editor", "password", "zeroize", "fuzzy-select", "fuzzy-matcher"] }
etcetera = { workspace = true }
figment = { workspace = true, features = ["json", "env", "yaml", "toml"] }
flate2 = { workspace = true, features = ["rust_backend"] }
humansize = { workspace = true }
humantime = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
serde_yaml_ng = { workspace = true }
tar = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true, features = ["attributes"] }
url = { workspace = true }
uuid = { workspace = true }
wasi-preview1-component-adapter-provider = "46"
wasm-metadata = { workspace = true }
wasm-pkg-client = { workspace = true }
wasm-pkg-core = { workspace = true }
wash-runtime = { workspace = true, features = ["washlet", "oci", "wasi-config", "wasi-logging", "wasi-blobstore", "wasi-keyvalue", "wasmcloud-postgres", "wasi-otel", "wasm_component_model_implements"] }
wit-component = { workspace = true }
custom_plugin_cf_d1 = { path = "../custom_plugin_cf_d1" }
custom_plugin_llm_gateway_provider = { path = "../custom_plugin_llm_gateway_provider" }
custom_plugin_mail = { path = "../custom_plugin_mail" }
custom_plugin_crontab = { path = "../custom_plugin_crontab" }
custom_plugin_dingtalk_stream = { path = "../custom_plugin_dingtalk_stream" }
custom_plugin_feishu = { path = "../custom_plugin_feishu" }
custom_plugin_codex = { path = "../custom_plugin_codex" }
custom_plugin_wechat = { path = "../custom_plugin_wechat" }
custom_plugin_telegram = { path = "../custom_plugin_telegram" }
custom_plugin_event_monitor = { path = "../custom_plugin_event_monitor" }
custom_plugin_workflow = { path = "../custom_plugin_workflow" }

[build-dependencies]
anyhow = { workspace = true, default-features = true }
tonic-prost-build = { workspace = true, default-features = true }
pbjson-build = { workspace = true, default-features = true }

[dev-dependencies]
bytes = { version = "1", default-features = false }
http = { version = "1.3.1", default-features = false }
http-body-util = { version = "0.1.3", default-features = false }
hyper = { workspace = true }
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "aws_lc_rs", "pem"] }
scopeguard = { version = "1.2", default-features = false }
tempfile = { version = "3.0", default-features = false }
tokio = { version = "1.45.1", default-features = false, features = ["full"] }
reqwest = { workspace = true, features = ["json"] }
wash-runtime = { workspace = true, features = ["wasi-keyvalue", "wasi-blobstore"] }
testcontainers = { workspace = true }
wat = { workspace = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{name}-v{version}/wash-{ target }{ binary-ext }"
pkg-fmt = "bin"
