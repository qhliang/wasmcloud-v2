[package]
name = "custom_plugin_feishu"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Custom host plugin for Feishu (Lark) IM messaging via WebSocket long connection"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
wasmtime = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# 必须走 workspace 声明（default-features = false + rustls-tls）：
# 此前写成 `version = "0.12"` 会打开 reqwest 默认特性 → native-tls → openssl-sys，
# 交叉编译 aarch64/x86_64-musl 时因缺该目标 OpenSSL 而构建失败（canary-binaries CI）。
# 本插件只用 Client/json/header，无需 multipart 等额外特性。
reqwest = { workspace = true }

wash-runtime = { path = "../wash-runtime" }

open-lark = { version = "0.14", default-features = false, features = [
    "websocket",
    "im",
    "bot",
    "authentication",
    "contact",
    "group",
    "ai",
    "calendar",
    "cardkit",
    "mail",
    "task",
    "cloud-docs",
    "otel",
] }
