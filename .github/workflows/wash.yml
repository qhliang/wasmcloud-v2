name: wash

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # The non-default features every `cargo test` and `cargo clippy` here runs
  # with. Spelled per-package: bare names apply to every selected package, so
  # the two would drift apart.
  OPTIONAL_FEATURES: wash-runtime/wasi-tls,wash/host-component-plugins
  # Drop most DWARF; keep enough for usable backtraces. Shrinks target/ by
  # several GB on this workspace (wasmtime, OTel, oci-client).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Swatinem/rust-cache doesn't cache target/<profile>/incremental, so on CI
  # incremental artifacts are pure disk cost with no reuse.
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/wash.yml'
              - '.github/tool-versions.env'
              - '.github/scripts/wasmtime-features.mjs'
              - 'crates/**'
              - 'src/**'
              - 'tests/**'
              - 'wit/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'runtime-operator/test/e2e/**'
              - 'charts/runtime-operator/**'
              - 'deploy/kind/kind-config.yaml'
            workflow:
              - '.github/workflows/wash.yml'

  check:
    needs:
      - changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.26.0"
          cache: false
      - name: Setup TinyGo
        uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3.0.1
        with:
          tinygo-version: "0.39.0"
      - name: Load pinned tool versions
        # Appends the KEY=VALUE lines from the pins file to $GITHUB_ENV,
        # skipping comment and blank lines. Subsequent steps then see
        # e.g. ${{ env.WASM_TOOLS_VERSION }}.
        shell: bash
        run: grep -vE '^[[:space:]]*(#|$)' .github/tool-versions.env >> "${GITHUB_ENV}"
      - name: Setup wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: ${{ env.WASM_TOOLS_VERSION }}
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      # Compile the wash-runtime wasm test fixtures. The test/bench targets
      # `include_bytes!` these, so they must exist before the `cargo test`
      # steps below. Targets wasm32-wasip2/wasip1 come from setup-rust.
      - name: Build test fixtures
        run: cargo xtask build-fixtures
      - name: Build
        run: cargo build
      # One pass with the optional features on. A default-feature pass would
      # recompile the tree to re-run the ~58 targets neither feature gates, so
      # nothing here runs in the configuration the released image ships.
      - name: Test
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test --workspace --features "${OPTIONAL_FEATURES}"
      # `#[ignore]` is what opts a suite INTO this step. Not all are containers
      # -- `test_pull_and_validate_ghcr_component` pulls from ghcr.io.
      - name: Integration tests (Docker/registry)
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test --workspace --features "${OPTIONAL_FEATURES}" -- --ignored
      # Bitrot guard. `cargo test --benches`, not `cargo bench --no-run`: the
      # bench profile shares no artifacts with the builds above. Same features
      # as Test, so `gungraun_plugin` is built rather than its stub.
      - name: Build benchmarks
        shell: bash
        run: |
          cargo test --workspace --features "${OPTIONAL_FEATURES}" --benches --no-run

  lint:
    needs:
      - changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-toolchain: nightly
          rust-components: rustfmt
      - name: Install cargo-machete
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        env:
          # Authenticate the action's GitHub API calls so they aren't throttled
          # by the 60/hr anonymous per-IP limit shared across hosted runners.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-machete@0.8.0
      - name: Format
        run: |
          cargo +nightly fmt -- --check
      - name: Lint
        run: |
          cargo clippy --workspace --features "${OPTIONAL_FEATURES}"
      - name: Lint anyhow context message casing
        run: |
          # anyhow `.context()` / `.with_context()` strings are error messages,
          # which by Rust convention start lowercase so they compose into error
          # chains. Match sentence-case prose (capital + lowercase) so acronyms
          # and type names (HTTP, P3, DevRouter) are left untouched.
          #
          # Scope is production source only (crates/*/src), matching the clippy
          # job above; integration tests are not checked. Only single-line
          # context calls are matched.
          if matches=$(grep -rn --include='*.rs' -E '\.(with_)?context\((\|\| )?(format!\()?"[A-Z][a-z]' crates/*/src); then
            echo "::error::anyhow context messages should start with a lowercase letter (Rust convention); lowercase the first letter:"
            echo "$matches"
            exit 1
          fi
      - name: Check for unused dependencies
        run: |
          cargo machete
      # Resolves only, no compiling, so it belongs with the other cheap checks
      # rather than in a build job. It reads the release matrix below for the
      # targets it covers.
      - name: Check wasmtime feature set across release targets
        run: |
          node .github/scripts/wasmtime-features.mjs

  # Build the shipped wash runtime image (DEFAULT features) on amd64 and push
  # it to GHCR by digest — the only source `canary-publish` assembles the
  # manifest list from.
  # Main only: amd64 is the deployment target, and the image build is the
  # slowest thing `canary-publish` waits on, so it stays off the PR path.
  # No tarball upload — no consumer runs on amd64.
  wash-image-amd64:
    needs:
      - changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.relevant == 'true') && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Single build+push: no tarball is exported (nothing loads it), so this
      # needs only one call. Ships DEFAULT features — exactly what we ship.
      - name: Push wash runtime image to GHCR by digest
        id: build_push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # provenance 必须关掉：默认开启会在 image index 里加一个 attestation 清单
          # （config 媒体类型 application/vnd.oci.empty.v1+json），阿里云 ACR 无法识别，
          # 导致后续 imagetools create 同步到 ACR 时 403/unknown manifest class。
          # fork 原版一直带此项，合入 upstream 时被删掉，遂复现。
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/wash,push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=wash-release-amd64-${{ github.head_ref || github.ref_name }}
            type=gha,scope=wash-release-amd64-main
          cache-to: type=gha,scope=wash-release-amd64-${{ github.head_ref || github.ref_name }},mode=max
      - name: Login to Aliyun ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://registry.cn-hangzhou.aliyuncs.com
          username: "${{ secrets.ALIYUN_ACR_USERNAME }}"
          password: "${{ secrets.ALIYUN_ACR_PASSWORD }}"
      - name: Copy wash image to Aliyun ACR
        # ACR 侧 tag 统一用 commit sha（原 digest hex 无法从 commit 推导）。
        # 带 `-amd64` 后缀是为了不和裸 `sha-<sha>` 抢同一个 tag；
        # 裸 tag（manifest list）+ `canary` 由 canary-publish 统一打。
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          set -euo pipefail
          SRC="ghcr.io/${{ github.repository_owner }}/wash@${DIGEST}"
          DST="registry.cn-hangzhou.aliyuncs.com/big_bumblebee/wash:sha-${GITHUB_SHA}-amd64"
          docker buildx imagetools create -t "${DST}" "${SRC}"

      - name: Export digest
        env:
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          if [[ -z "$DIGEST" ]]; then
            echo "no digest on build step output" >&2
            exit 1
          fi
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wash-image-digest-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  gate:
    needs:
      - check
      - lint
      - wash-image-amd64
      - canary-publish
      - canary-binaries
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          CANARY_PUBLISH_RESULT: ${{ needs.canary-publish.result }}
          CANARY_BINARIES_RESULT: ${{ needs.canary-binaries.result }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            exit 1
          fi
          # Main pushes must publish canary.
          if [[ "${REF}" == "refs/heads/main" ]] && [[ "${CANARY_PUBLISH_RESULT}" != "success" ]]; then
            echo "canary-publish result=${CANARY_PUBLISH_RESULT} on main push; expected success" >&2
            exit 1
          fi
          # Main pushes must also build the per-target binaries that
          # release-tag.yml attaches to the GH Release.
          if [[ "${REF}" == "refs/heads/main" ]] && [[ "${CANARY_BINARIES_RESULT}" != "success" ]]; then
            echo "canary-binaries result=${CANARY_BINARIES_RESULT} on main push; expected success" >&2
            exit 1
          fi

  # Tag promotion: only push `canary` once check, lint, and the image build
  # have all passed against this commit. Assembles the manifest list from the
  # digest that `wash-image-amd64` pushed.
  # The `sha-<full-sha>` tag is what release-tag.yml pins to when it
  # promotes this canary digest as the immutable vX.Y.Z release tag —
  # `canary` itself moves on every subsequent main push, so we cannot
  # rely on it.
  #
  # The same tag set is mirrored to Aliyun ACR in one `imagetools create`
  # call, so both registries carry identical `canary` and `sha-<full-sha>`
  # tags. This restores the behaviour the fork had before the upstream
  # v2.9.0 merge dropped wash.yml's ACR customisation (commit 991e4ebfb);
  # the 2026-09-13 restore only brought back a per-arch copy that tagged by
  # raw digest, which left ACR without any commit-addressable handle.
  canary-publish:
    # Gate canary on the thing that produces the published bytes:
    # `wash-image-amd64` is what gets pushed by digest. `check`/`lint` are
    # workspace-level signals that have no bearing on the image we're
    # promoting, so they intentionally aren't gates here.
    # `always()` is required to break the chained-skip propagation from the
    # path-filter `changes` job (skipped on main) which would otherwise mark
    # this job skipped before evaluating the explicit gate.
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.wash-image-amd64.result == 'success'
    needs:
      - wash-image-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: wash-image-digest-*
          merge-multiple: true
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/wash
          tags: |
            type=raw,value=canary
            type=sha,format=long,prefix=sha-
      - name: Create manifest list and push tags
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if (( ${#tags[@]} == 0 )); then
            echo "No tags from docker meta. Refusing to push" >&2
            exit 1
          fi
          shopt -s nullglob
          digests=( * )
          shopt -u nullglob
          if (( ${#digests[@]} == 0 )); then
            echo "No digests downloaded. Refusing to push" >&2
            exit 1
          fi
          args=()
          for tag in "${tags[@]}"; do
            args+=(-t "$tag")
          done
          for d in "${digests[@]}"; do
            args+=("ghcr.io/${{ github.repository_owner }}/wash@sha256:$d")
          done
          docker buildx imagetools create "${args[@]}"
      - name: Inspect image
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/wash:${STEPS_META_OUTPUTS_VERSION}"
        env:
          STEPS_META_OUTPUTS_VERSION: ${{ steps.meta.outputs.version }}
      # ACR 登录必须排在本 job 内**所有** ghcr.io 操作（推送 + inspect）之后。
      # 原因不是网络或顺序偏好，而是 aliyun/acr-login@v1 的实现：它并不执行
      # `docker login`，而是自己造一个只含 ACR 一条 auth 的 config.json，再把
      # DOCKER_CONFIG 重新导出指向该临时目录（dist/index.js 的 run() 末尾
      # `io.mkdirP` + `fs.writeFileSync` + `core.exportVariable('DOCKER_CONFIG', …)`）。
      # 于是 docker/login-action 为 ghcr.io 写进 ~/.docker/config.json 的凭据被整体
      # 旁路，其后任何 ghcr 操作都以 401 失败（曾因此让 canary-publish 变红：
      # `PUT …/manifests/sha-<sha>: 401 Unauthorized`）。
      # per-arch 的 wash-image* job 同样遵循「先 ghcr、后 acr」的顺序。
      - name: Login to Aliyun ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://registry.cn-hangzhou.aliyuncs.com
          username: "${{ secrets.ALIYUN_ACR_USERNAME }}"
          password: "${{ secrets.ALIYUN_ACR_PASSWORD }}"
      - name: Create ACR manifest list and push tags
        # 与 GHCR 逐字相同的两个 tag（`canary` + `sha-<full-sha>`），都用 commit sha，
        # 于是「commit → 镜像 tag」的推导在两个 registry 上完全一致（原来 ACR 只有 per-arch
        # 的 digest hex tag，无法从 commit 推导）。源用 ACR 本地 digest——per-arch 的
        # `Copy wash image to Aliyun ACR` 已把清单拷过去，故这里不依赖跨 registry 拷贝；
        # 单独一步也让 GHCR 的 tag 先落地，ACR 若出问题不牵连 GHCR。
        working-directory: /tmp/digests
        env:
          ACR_IMAGE: registry.cn-hangzhou.aliyuncs.com/big_bumblebee/wash
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=( * )
          shopt -u nullglob
          if (( ${#digests[@]} == 0 )); then
            echo "No digests downloaded. Refusing to push" >&2
            exit 1
          fi
          args=(-t "${ACR_IMAGE}:canary" -t "${ACR_IMAGE}:sha-${GITHUB_SHA}")
          for d in "${digests[@]}"; do
            args+=("${ACR_IMAGE}@sha256:$d")
          done
          docker buildx imagetools create "${args[@]}"
      - name: Inspect ACR image
        # 把「ACR 上这两个 tag 确实存在」写进日志，免得等到部署时才发现没打上。
        env:
          ACR_IMAGE: registry.cn-hangzhou.aliyuncs.com/big_bumblebee/wash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${ACR_IMAGE}:sha-${GITHUB_SHA}"
          docker buildx imagetools inspect "${ACR_IMAGE}:canary"

  # Canary matrix binary build. Runs on every push to main so each commit
  # exercises the release-target build that the regular `check`/`lint` jobs
  # don't cover, and so release-tag.yml can promote the exact bytes that the
  # canary CI tested instead of rebuilding on tag.
  canary-binaries:
    # Fires on every main push and on `workflow_dispatch`, plus on PRs that
    # edit this workflow so a newly added build target is validated before
    # merge rather than only after it lands on main. `always()` breaks the
    # skipped-`changes` propagation; the explicit per-need success gates
    # restore the default `success()` check.
    if: |
      always() &&
      needs.check.result == 'success' &&
      needs.lint.result == 'success' &&
      (
        ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.workflow == 'true')
      )
    needs:
      - changes
      - check
      - lint
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # Pin minimum glibc to 2.17 (RHEL 7 / CentOS 7 era) for broad
            # compatibility with mainstream distros. GPU drivers on Ubuntu,
            # Fedora, Arch, RHEL, etc. are glibc-linked, so this binary can
            # dlopen them reliably.
            buildTarget: x86_64-unknown-linux-gnu.2.17
            buildCommand: cargo zigbuild
            artifact: wash-x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            bin: wash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          rust-toolchain: stable
          # Only needed for ubuntu
          install-zigbuild: ${{ matrix.runner == 'ubuntu-latest' }}
          rust-targets: "${{ matrix.target }}"

      - name: Set SOURCE_DATE_EPOCH from commit timestamp
        # Pin embedded timestamps in the binary to the merge commit's author
        # date so the same commit produces the same bytes on every rebuild.
        # cargo and rustc honor SOURCE_DATE_EPOCH for build metadata; this
        # is a prerequisite for any future move toward bit-reproducible
        # SLSA L4 builds. See https://reproducible-builds.org/docs/source-date-epoch/
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "${GITHUB_ENV}"

      - name: Build binary (${{ matrix.target }})
        env:
          # Retry transient crates.io download failures (e.g. SSL eof) more
          # aggressively than cargo's default of 3.
          CARGO_NET_RETRY: "10"
        run: |
          # Release binaries ship with default features only — no
          # `(implements ..)` multiplexing (it is exercised in the e2e host
          # image, not shipped in a release build).
          ${{ matrix.buildCommand }} --release --target ${{ matrix.buildTarget || matrix.target }} -p wash
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
